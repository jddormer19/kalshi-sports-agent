name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Byte-compile and import every module; tests that need the git-ignored data skip themselves.
      - run: python -m compileall -q kalshi run.py benchmark agent evals news
      - run: python -c "import kalshi.api, kalshi.collect, kalshi.features, kalshi.train, kalshi.backtest, kalshi.predict"
      - run: python -m pytest -q tests/
